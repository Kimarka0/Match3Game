<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <title>Match3Game</title>

  <!-- Yandex SDK (в среде Яндекса этот путь существует) -->
  <script src="/sdk.js"></script>

  <!-- Никаких TemplateData, т.к. у тебя папки нет -->
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #unity-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: block;
    }

    #unity-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background: #000;
      outline: none;
    }

    #unity-loading {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 360px;
      max-width: 80vw;
      color: #fff;
      text-align: center;
      z-index: 10;
      user-select: none;
    }

    #unity-progress-empty {
      width: 100%;
      height: 14px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    #unity-progress-full {
      width: 0%;
      height: 100%;
      background: rgba(255,255,255,0.85);
    }

    #unity-warning {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 12px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    #unity-fullscreen {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 15;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.15);
      color: #fff;
      cursor: pointer;
      pointer-events: auto;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="unity-loading">
      <div>Загрузка…</div>
      <div id="unity-progress-empty">
        <div id="unity-progress-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>
    <div id="unity-fullscreen">Fullscreen</div>
  </div>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loading = document.querySelector("#unity-loading");
    const progressFull = document.querySelector("#unity-progress-full");
    const fullscreenBtn = document.querySelector("#unity-fullscreen");

    function unityShowBanner(msg, type) {
      const warningBanner = document.querySelector("#unity-warning");
      const div = document.createElement("div");
      div.innerHTML = msg;
      div.style.padding = "10px";
      div.style.borderRadius = "10px";
      div.style.background = (type === "error")
        ? "rgba(255, 0, 0, 0.85)"
        : "rgba(255, 255, 0, 0.85)";
      div.style.color = "#000";
      warningBanner.appendChild(div);

      if (type !== "error") {
        setTimeout(() => {
          if (div.parentNode) div.parentNode.removeChild(div);
        }, 5000);
      }
    }

    // Мобильный viewport (в Яндексе часто мобильный WebView)
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      const meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
      document.head.appendChild(meta);
    }

    // --- ВАЖНО: имена файлов как у тебя в Build/ ---
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/Match3GameBuild.loader.js";

    const config = {
      arguments: [],
      dataUrl: buildUrl + "/Match3GameBuild.data",
      frameworkUrl: buildUrl + "/Match3GameBuild.framework.js",
      codeUrl: buildUrl + "/Match3GameBuild.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Match3Game",
      productVersion: "1.0",
      showBanner: unityShowBanner
    };

    loading.style.display = "block";

    const script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressFull.style.width = (progress * 100) + "%";
      }).then((unityInstance) => {
        loading.style.display = "none";

        fullscreenBtn.onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }).catch((message) => {
        unityShowBanner(message, "error");
        console.error(message);
      });
    };

    script.onerror = () => {
      unityShowBanner("Не удалось загрузить Unity loader: " + loaderUrl, "error");
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
