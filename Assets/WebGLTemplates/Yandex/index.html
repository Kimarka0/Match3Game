<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <title>Match 3</title>

  <!-- Yandex SDK (в среде Яндекса этот путь существует) -->
  <script src="/sdk.js"></script>

  <!-- Если TemplateData нет — не подключаем -->
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #unity-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #unity-canvas {
      background: #000;
      outline: none;
    }
    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 360px;
      max-width: 80vw;
      text-align: center;
      color: #fff;
    }
    #unity-progress-bar-empty {
      width: 100%;
      height: 14px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }
    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: rgba(255,255,255,0.85);
    }
    #unity-warning {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 10px;
      z-index: 10;
      color: #fff;
    }
    #unity-footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 8px 10px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      pointer-events: none;
    }
    #unity-fullscreen-button {
      pointer-events: auto;
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div>Загрузка…</div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-fullscreen-button">Fullscreen</div>
    </div>
  </div>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const fullscreenButton = document.querySelector("#unity-fullscreen-button");

    function unityShowBanner(msg, type) {
      const warningBanner = document.querySelector("#unity-warning");
      const div = document.createElement('div');
      div.innerHTML = msg;
      div.style.padding = "10px";
      div.style.marginBottom = "6px";
      div.style.borderRadius = "8px";
      div.style.background = type === "error" ? "rgba(255,0,0,0.8)" : "rgba(255,255,0,0.8)";
      div.style.color = "#000";
      warningBanner.appendChild(div);

      if (type !== "error") {
        setTimeout(() => {
          warningBanner.removeChild(div);
        }, 5000);
      }
    }

    // --- ВАЖНО: имена файлов как у тебя в Build/ ---
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/Match3GameBuild.loader.js";

    const config = {
      arguments: [],
      dataUrl: buildUrl + "/Match3GameBuild.data",
      frameworkUrl: buildUrl + "/Match3GameBuild.framework.js",
      codeUrl: buildUrl + "/Match3GameBuild.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Match3Game",
      productVersion: "1.0",
      showBanner: unityShowBanner
    };

    // Canvas sizing
    function resizeCanvas() {
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      if (isMobile) {
        canvas.style.width = "100vw";
        canvas.style.height = "100vh";
      } else {
        // Можно оставить фиксированные, но лучше адаптив
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    loadingBar.style.display = "block";

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (100 * progress) + "%";
      }).then((unityInstance) => {
        loadingBar.style.display = "none";

        fullscreenButton.onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }).catch((message) => {
        unityShowBanner(message, "error");
        console.error(message);
      });
    };

    script.onerror = () => {
      unityShowBanner("Не удалось загрузить Unity loader: " + loaderUrl, "error");
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
